<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>早安邮件示例</title>
</head>
<body style="margin:0;background:#edf2f4;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;color:#18333b;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#edf2f4;padding:32px 12px;">
    <tr><td align="center">
      <table role="presentation" width="600" cellspacing="0" cellpadding="0" style="max-width:600px;width:100%;background:#ffffff;border-radius:8px;overflow:hidden;">
        <tr><td style="height:6px;background:#ee795d;font-size:0;line-height:0;">&nbsp;</td></tr>
        <tr><td style="background:#173f4a;padding:34px 34px 30px;color:#ffffff;">
          <div style="font-size:11px;font-weight:700;letter-spacing:1px;color:#a9d8db;">MORNING WEATHER NOTE</div>
          <div style="font-size:30px;font-weight:700;line-height:1.25;margin-top:12px;">早安，示例地区</div>
          <div style="font-size:14px;line-height:1.5;color:#c4d8db;margin-top:7px;">2026年10月30日 · 星期五</div>
        </td></tr>
        <tr><td style="padding:30px 34px 12px;"><div style="border-left:3px solid #ee795d;padding-left:13px;font-size:16px;line-height:1.7;color:#35535b;">愿你今天心有方向，行有所获。</div></td></tr>
        <tr><td style="padding:20px 34px 28px;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="border:1px solid #d9e5e7;border-radius:8px;overflow:hidden;">
            <tr><td style="padding:24px 22px 20px;">
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0"><tr>
                <td style="vertical-align:top;"><div style="font-size:13px;font-weight:700;letter-spacing:.5px;color:#52737b;">今日天气</div><div style="font-size:18px;font-weight:700;color:#173f4a;margin-top:8px;">&#9925;&nbsp;多云</div></td>
                <td align="right" style="vertical-align:top;"><span style="font-size:48px;font-weight:700;line-height:1;color:#173f4a;">24</span><span style="font-size:18px;font-weight:700;color:#173f4a;">°C</span><div style="font-size:12px;color:#6b858b;margin-top:6px;">体感 25°C</div></td>
              </tr></table>
            </td></tr>
            <tr><td style="background:#f4f8f8;padding:15px 22px;">
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0"><tr>
                <td width="50%" style="font-size:13px;color:#52737b;border-right:1px solid #d9e5e7;"><span style="display:block;font-size:11px;color:#82999e;margin-bottom:4px;">温度范围</span><strong style="font-size:15px;color:#173f4a;">21°C — 28°C</strong></td>
                <td style="padding-left:20px;font-size:13px;color:#52737b;"><span style="display:block;font-size:11px;color:#82999e;margin-bottom:4px;">风况</span><strong style="font-size:15px;color:#173f4a;">东北风 3级</strong></td>
              </tr></table>
            </td></tr>
          </table>
        </td></tr>
        <tr><td style="padding:0 34px 28px;text-align:center;font-size:12px;line-height:1.5;color:#82999e;">每天 07:30，由 GitHub Actions 自动送达</td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
