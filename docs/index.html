<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>早安邮件示例</title>
</head>
<body style="margin:0;background:#f3f6f4;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;color:#183028;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f3f6f4;padding:28px 12px;">
    <tr><td align="center">
      <table role="presentation" width="600" cellspacing="0" cellpadding="0" style="max-width:600px;width:100%;background:#fff;border-radius:8px;overflow:hidden;">
        <tr><td style="background:#176b4d;padding:32px 30px;color:#fff;">
          <div style="font-size:26px;font-weight:700;">早安</div>
          <div style="font-size:14px;opacity:.86;margin-top:8px;">2026年10月30日 星期五 · 示例地区</div>
        </td></tr>
        <tr><td style="padding:28px 30px;">
          <p style="margin:0 0 22px;font-size:16px;line-height:1.7;">愿你今天心有方向，行有所获。</p>
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#eef7f2;border-radius:8px;">
            <tr><td style="padding:22px;">
              <div style="font-size:14px;font-weight:700;color:#176b4d;margin-bottom:14px;">&#9925;&nbsp; 今日天气</div>
              <div style="font-size:34px;font-weight:700;line-height:1;">24<span style="font-size:18px;">°C</span></div>
              <div style="font-size:15px;margin-top:10px;">多云 · 体感 25°C</div>
              <div style="font-size:14px;color:#527064;margin-top:8px;">最高 28°C / 最低 21°C · 东北风 3级</div>
            </td></tr>
          </table>
        </td></tr>
        <tr><td style="padding:0 30px 24px;color:#82958c;font-size:12px;text-align:center;">由 GitHub Actions 自动发送</td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
